name: 🔐 Pipeline DevSecOps
run-name:  ${{ github.head_ref && format('🔐 Pipeline DevSecOps - {0} | {1}', github.head_ref, github.ref_name) || format('🔐 Pipeline DevSecOps - {0}', github.ref_name) }}

on:
  # Push na branch main - Mesmo que ela seja protegida e só receba PRs aprovados. Uma camada adicional de segurança e verificação.
  push:
    branches:
      - main
  
  # Pull Request para a branch main - Será executada quando um PR for aberto, reaberto ou sincronizado. Bloqueio e exigência de sucesso em ruleset do github.
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

  # Disparos manuais - Permite que o desenvolvedor possa validar sua branch antes de abrir o PR. Em situação real, pode ser um workflow separado ou o mesmo apenas com ajustes de condições nos jobs e actions.
  workflow_dispatch:

  # [DESABILITADO - APENAS EXEMPLO]
  # Disparos agendados - Permite que o workflow seja executado em horários específicos, como uma varredura semanal de segurança. Garante que a branch estável sempre seja verificada.
  # schedule:
  #   - cron: '0 3 * * 1' # Toda segunda-feira, 00:00 no horário de Brasília (UTC-3)

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # ────────────────────────────────────────────────────────────────
  # JOB 1 — Validações necessárias (variáveis, secrets)
  # ────────────────────────────────────────────────────────────────
  verify:
    name: Verificações de variáveis e secrets cadastradas
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do Código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: 🔐 Validar secrets obrigatórios
        env:
          API_KEY: ${{ secrets.API_KEY }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        shell: bash
        run: |
          for secret in API_KEY DB_PASSWORD; do
            if [ -z "${!secret}" ]; then
              echo "::error::O secret $secret não está configurado ou está vazio"
              exit 1
            fi
            echo "::notice::O secret $secret configurado com sucesso"
          done

  # ────────────────────────────────────────────────────────────────
  # JOB 2 — Build
  # ────────────────────────────────────────────────────────────────
  build:
    name: Simulação de build do projeto
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do Código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: 🔐 Inserir Secrets no JavaScript
        env:
          API_KEY: ${{ secrets.API_KEY }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        shell: bash
        run: |
          sed -i "s|SECRET_API_KEY|${API_KEY}|g" src/script.js
          sed -i "s|SECRET_DB_PASSWORD|${DB_PASSWORD}|g" src/script.js

      - name: 🔐 Validar inserção dos valores da secret
        env:
          API_KEY: ${{ secrets.API_KEY }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        shell: bash
        run: |
          for key in API_KEY DB_PASSWORD; do
            value="${!key}"
            if grep -Fq -- "$value" src/script.js; then
              echo "$key inserida com sucesso"
            else
              echo "::error::Falha ao inserir $key"
              exit 1
            fi
          done

      - name: ⚙️ Build
        run: |
          echo "Verificando arquivos..."
          ls src/
          echo "Build OK!"
   
  # ────────────────────────────────────────────────────────────────
  # JOB 3.1 — Scan de Secrets
  # ────────────────────────────────────────────────────────────────
  secret-scan:
    name: Scan de Secrets
    needs: build
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout do Código
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: 🔑 Secrets Scanning [histórico completo]
      if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
      run: |
        # v8.30.1
        docker run --rm \
          -v "${{ github.workspace }}:/repo" \
          -w /repo \
          ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
          git --verbose --redact --log-opts="--all" .

    - name: 🔑 Secrets Scanning [commits do evento]
      if: github.event_name == 'pull_request' || github.event_name == 'push'
      env:
        BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event.after }}
      shell: bash
      run: |
        if [[ "$BASE_SHA" =~ ^0+$ ]]; then
          LOG_OPTS="--all"
        else
          LOG_OPTS="--all $BASE_SHA..$HEAD_SHA"
        fi

        # v8.30.1
        docker run --rm \
          -v "${{ github.workspace }}:/repo" \
          -w /repo \
          ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
          git --verbose --redact --log-opts="$LOG_OPTS" 

  # ────────────────────────────────────────────────────────────────
  # JOB 3.2 — SAST - Semgrep
  # ────────────────────────────────────────────────────────────────
  sast-semgrep:
    name: SAST - Semgrep
    needs: build
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout do Código
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: 🔍 SAST - Semgrep
      shell: bash
      run: |
        python3 -m pip install semgrep
        semgrep scan --config auto --config p/xss --error src/

  # ────────────────────────────────────────────────────────────────
  # JOB 3.3 — SCA - Grype
  # ────────────────────────────────────────────────────────────────
  sca-grype:
    name: SCA - Grype
    needs: build
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout do Código
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: 📦 SCA - Geração do package-lock
      run: |
        npm install --package-lock-only --no-audit --no-fund

    - name: 📦 SCA - Instalação do Grype
      run: |
        curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh \
          | sh -s -- -b /usr/local/bin

        echo "/usr/local/bin" >> $GITHUB_PATH

        grype dir:. --fail-on medium

  # ────────────────────────────────────────────────────────────────
  # JOB 4 — Empacotamento, assinatura e upload do artefato
  # ────────────────────────────────────────────────────────────────
  package-artifact:
    name: Empacotar Artefato
    needs: [secret-scan, sast-semgrep, sca-grype]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.secret-scan.result == 'success' &&
      needs.sast-semgrep.result == 'success' &&
      needs.sca-grype.result == 'success'
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout do Código
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    # ── Empacota o site em um artefato tar (formato que o Pages consome)
    - name: 📦 Empacotar artefato do site
      run: |
        tar \
          --dereference --hard-dereference \
          -C src \
          -cvf artifact.tar \
          --exclude=.git --exclude=.github \
          .

    # ── Calcula o hash do artefato
    - name: 🔢 Hash do artefato
      run: |
        digest=$(sha256sum artifact.tar | awk '{print $1}')
        echo "$digest" > artifact.tar.sha256
        echo "SHA256: $digest"

    - name: ✍️ Instalar Cosign
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

    - name: ✍️ Assinar artefato
      run: |
        cosign sign-blob --yes --bundle artifact.sigstore.json artifact.tar

    # ── Publica o artefato + bundle de assinatura para o próximo job
    - name: ⬆️ Upload do artefato assinado
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: site-assinado
        path: |
          artifact.tar
          artifact.sigstore.json
          artifact.tar.sha256
        retention-days: 1

  # ────────────────────────────────────────────────────────────────
  # JOB 5 — Verifica a assinatura e só então faz o deploy
  # ────────────────────────────────────────────────────────────────
  deploy:
    name: Verificação e Deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.package-artifact.result == 'success'
    needs: package-artifact
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 📥 Checkout do Código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: ⬇️ Baixar o artefato assinado
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-assinado

      - name: ✍️ Instalar Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: 🔎 Verificar assinatura do artefato
        run: |
          cosign verify-blob artifact.tar \
            --bundle artifact.sigstore.json \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/.github/workflows/.*" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
          echo "Assinatura válida — artefato íntegro e autêntico."

      # Descompacta o site para publicar
      - name: 📂 Extrair site verificado
        run: |
          mkdir -p site
          tar -xvf artifact.tar -C site

      - name: 🌐 Configurar GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: 📤 Upload para Produção
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./site

      # Realiza o deploy
      - name: 🚀 Deploy em Produção
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
