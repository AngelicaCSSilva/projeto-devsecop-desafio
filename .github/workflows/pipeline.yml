name: 🔐 Pipeline DevSecOps

on:
  # Push na branch main - Mesmo que ela seja protegida e só receba PRs aprovados. Uma camada adicional de segurança e verificação.
  push:
    branches:
      - main
  
  # Pull Request para a branch main - Será executada quando um PR for aberto, reaberto ou sincronizado. Bloqueio e exigência de sucesso em ruleset do github.
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

  # Disparos manuais - Permite que o desenvolvedor possa validar sua branch antes de abrir o PR. Em situação real, pode ser um workflow separado ou o mesmo apenas com ajustes de condições nos jobs e actions.
  workflow_dispatch:

  # [DESABILITADO - APENAS EXEMPLO]
  # Disparos agendados - Permite que o workflow seja executado em horários específicos, como uma varredura semanal de segurança. Garante que a branch estável sempre seja verificada.
  # schedule:
  #   - cron: '0 3 * * 1' # Toda segunda-feira, 00:00 no horário de Brasília (UTC-3)

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # ────────────────────────────────────────────────────────────────
  # JOB 1 — Build, segurança e assinatura do artefato
  # ────────────────────────────────────────────────────────────────
  build:
    name: Build, Segurança e Assinatura
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do Código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: 🔐 Validar secrets obrigatórios
        env:
          API_KEY: ${{ secrets.API_KEY }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        shell: bash
        run: |
          for secret in API_KEY DB_PASSWORD; do
            if [ -z "${!secret}" ]; then
              echo "::error::O secret $secret não está configurado ou está vazio"
              exit 1
            fi
            echo "::notice::O secret $secret configurado com sucesso"
          done

      - name: 🔐 Inserir Secrets no JavaScript
        env:
          API_KEY: ${{ secrets.API_KEY }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        shell: bash
        run: |
          sed -i "s|SECRET_API_KEY|${API_KEY}|g" src/script.js
          sed -i "s|SECRET_DB_PASSWORD|${DB_PASSWORD}|g" src/script.js

      - name: 🔐 Validar inserção dos valores da secret
        env:
          API_KEY: ${{ secrets.API_KEY }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        shell: bash
        run: |
          for key in API_KEY DB_PASSWORD; do
            value="${!key}"
            if grep -Fq -- "$value" src/script.js; then
              echo "$key inserida com sucesso"
            else
              echo "::error::Falha ao inserir $key"
              exit 1
            fi
          done

      - name: ⚙️ Build
        run: |
          echo "Verificando arquivos..."
          ls src/
          echo "Build OK!"
                
      - name: 🔑 Secrets Scanning [histórico completo]
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.0 \
            git --verbose --redact --log-opts="--all" .

      - name: 🔑 Secrets Scanning [commits do evento]
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event.after }}
        shell: bash
        run: |
          if [[ "$BASE_SHA" =~ ^0+$ ]]; then
            LOG_OPTS="--all"
          else
            LOG_OPTS="--all $BASE_SHA..$HEAD_SHA"
          fi

          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.0 \
            git --verbose --redact --log-opts="$LOG_OPTS" 

      - name: 🔍 SAST - Semgrep
        shell: bash
        run: |
          python3 -m pip install semgrep
          semgrep scan --config auto --config p/xss --error src/

      # ❌ PASSO A IMPLEMENTAR — SCA com Grype
      # Dica: primeiro, gere o package-lock pelo npm:
      #   npm install --package-lock-only --no-audit --no-fund
      # Depois instale o Grype:
      #   curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
      # E rode:
      #   grype dir:. --fail-on medium
      - name: 📦 SCA - Grype
        run: echo "TODO - implemente o SCA com Grype aqui"

      # ── Empacota o site em um artefato tar (formato que o Pages consome)
      - name: 📦 Empacotar artefato do site
        run: |
          tar \
            --dereference --hard-dereference \
            -C src \
            -cvf artifact.tar \
            --exclude=.git --exclude=.github \
            .

      # ── Calcula o hash do artefato
      - name: 🔢 Hash do artefato
        run: |
          digest=$(sha256sum artifact.tar | awk '{print $1}')
          echo "$digest" > artifact.tar.sha256
          echo "SHA256: $digest"

      - name: ✍️ Instalar Cosign
        uses: sigstore/cosign-installer@v3

      # ❌ PASSO A IMPLEMENTAR — Assinatura via Cosign
      # Este passo NÃO assina de verdade — ele gera um bundle falso, só para
      # demonstração.
      #
      # Dica da assinatura real:
      #   cosign sign-blob artifact.tar --bundle artifact.sigstore.json --yes
      - name: ✍️ Assinar artefato
        run: |
          echo '{ "mock": "assinatura-invalida-para-demonstracao" }' > artifact.sigstore.json
          echo "Assinatura MOCK gerada."

      # ── Publica o artefato + bundle de assinatura para o próximo job
      - name: ⬆️ Upload do artefato assinado
        uses: actions/upload-artifact@v4
        with:
          name: site-assinado
          path: |
            artifact.tar
            artifact.sigstore.json
            artifact.tar.sha256
          retention-days: 1

  # ────────────────────────────────────────────────────────────────
  # JOB 2 — Verifica a assinatura e só então faz o deploy
  # ────────────────────────────────────────────────────────────────
  deploy:
    name: Verificação e Deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: ⬇️ Baixar o artefato assinado
        uses: actions/download-artifact@v4
        with:
          name: site-assinado

      - name: ✍️ Instalar Cosign
        uses: sigstore/cosign-installer@v3

      # ⚠️ Usa o Cosign para validar assinatura do artefato - descomentar após assinatura
      # - name: 🔎 Verificar assinatura do artefato
      #  run: |
      #    cosign verify-blob artifact.tar \
      #      --bundle artifact.sigstore.json \
      #      --certificate-identity-regexp "^https://github.com/${{ github.repository }}/.github/workflows/.*" \
      #      --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
      #    echo "Assinatura válida — artefato íntegro e autêntico."

      # Descompacta o site para publicar
      - name: 📂 Extrair site verificado
        run: |
          mkdir -p site
          tar -xvf artifact.tar -C site

      - name: 🌐 Configurar GitHub Pages
        uses: actions/configure-pages@v4

      - name: 📤 Upload para Produção
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      # Realiza o deploy
      - name: 🚀 Deploy em Produção
        id: deployment
        uses: actions/deploy-pages@v4